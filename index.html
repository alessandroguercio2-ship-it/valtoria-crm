const seed={clients:[{id:1,name:'Isabelle Moreau',email:'isabelle@example.com',phone:'+33 6 12 34 56 78',channel:'WhatsApp',status:'VIP',value:12400,note:'Compleanno sabato. Preferisce la mattina.'},{id:2,name:'Alexander Kroll',email:'alexander@example.com',phone:'',channel:'Telefono',status:'Cliente',value:8600,note:'Collezionista, 4 montature. Da ricontattare.'},{id:3,name:'Sofia Laurent',email:'sofia@example.com',phone:'',channel:'WhatsApp',status:'Lead',value:2400,note:'Interessata ad Amaterasu Gold n. 35'},{id:4,name:'Marco Rossi',email:'marco@example.com',phone:'',channel:'Email',status:'Cliente',value:3200,note:'Sostituzione lenti in attesa.'}],leads:[{id:5,name:'Emma Dubois',email:'emma@example.com',channel:'Instagram',status:'Nuovo',value:1800,note:'Richiesta collezione autunno'},{id:6,name:'Luca Bianchi',email:'luca@example.com',channel:'Website',status:'Contattato',value:2400,note:'Inviare catalogo'},{id:7,name:'Sofia Laurent',email:'sofia@example.com',channel:'WhatsApp',status:'Proposta',value:2400,note:'Amaterasu Gold n. 35'}],orders:[{id:8,name:'ORD-1042 · Isabelle Moreau',email:'Amaterasu Gold · 12/40',channel:'Boutique',status:'Confermato',value:2400,note:'Consegna entro il 28 ottobre'},{id:9,name:'ORD-1041 · Alexander Kroll',email:'Helios Gold',channel:'Email',status:'In produzione',value:3200,note:'Ritardo produttore di 9 giorni'},{id:10,name:'ORD-1040 · Marco Rossi',email:'Ryo Titanium Grey',channel:'Boutique',status:'Spedito',value:1800,note:'Sostituzione lenti'}],tasks:[{id:11,name:'Fiori e champagne per il preview',date:'Giovedì',owner:'Anna',done:false},{id:12,name:'Avvisare 3 clienti del ritardo Helios',date:'Oggi',owner:'Léa',done:false},{id:13,name:'Campioni Tina Bordeaux per il lancio',date:'Venerdì',owner:'Studio',done:false},{id:14,name:'Condizioni wholesale per Dubai',date:'Lunedì',owner:'Alessandro',done:false}]};let db;try{db=JSON.parse(localStorage.getItem('valtoriaCRM'))||structuredClone(seed)}catch{db=structuredClone(seed)}let view='home',query='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n),save=()=>localStorage.setItem('valtoriaCRM',JSON.stringify(db));const navs=[['home','▣','Oggi'],['clients','♧','Clienti'],['leads','▤','Inbox lead'],['orders','♙','Ordini'],['stock','♢','Edizioni e stock'],['production','♧','Produzione'],['events','▦','Appuntamenti'],['tasks','☷','Team e attività']];$('#date').textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2800)}function go(v){view=v;query='';$('#globalSearch').value='';render()}function head(t,sub='',action=''){return `<div class="panelhead"><h2>${t}</h2><small>${sub}</small>${action}</div>`}function tasks(){return db.tasks.map(t=>`<div class="task"><input aria-label="Completa ${esc(t.name)}" type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id})"><div class="tasktext">${esc(t.name)}<small>${esc(t.date)}</small></div><span class="btn">${esc(t.owner)}</span></div>`).join('')}function toggle(id){db.tasks.find(t=>t.id===id).done=!db.tasks.find(t=>t.id===id).done;save();render()}function production(){return [['PO-0412 · Helios Gold','20 pezzi · in ritardo',2,true],['PO-0415 · Infinity','12 pezzi · puntuale',4,false],['PO-0419 · Tina Bordeaux','40 pezzi · nuova edizione',1,false]].map(([n,s,k,l])=>`<div class="production"><div><strong>${n}</strong><small>${s}</small></div><div class="steps">${['Ordinato','Produzione','Qualità','Spedito','Ricevuto'].map((x,i)=>`<div class="step ${i<k?'done':i===k?(l?'late':'current'):''}">${x}</div>`).join('')}</div></div>`).join('')}function dashboard(){return `<div class="stats"><div class="stat glass"><span class="muted">Vendite questo mese</span><div class="big">€47.520</div><span class="badge">↑ 18%</span> <small>24 montature</small><svg class="chart" viewBox="0 0 300 80"><path d="M0 70 L25 62 50 65 77 51 104 55 132 39 157 44 184 29 211 33 236 18 263 22 285 8 300 3 L300 80 0 80" fill="#b18f5522"/><path d="M0 70 L25 62 50 65 77 51 104 55 132 39 157 44 184 29 211 33 236 18 263 22 285 8 300 3" fill="none" stroke="#b18f55" stroke-width="3"/></svg></div><div class="stat glass"><span class="muted">Amaterasu Gold edition</span><div class="edition"><div class="ring">34</div><div><strong>6 rimasti</strong><small>di 40 pezzi numerati</small><span class="badge red">Esauriti in 5 sett.</span></div></div></div><div class="stat glass"><span class="muted">Lead aperti</span><div class="big">${db.leads.filter(l=>l.status!=='Convertito').length}</div><span class="badge gold">${db.leads.filter(l=>l.status==='Nuovo').length} nuovi</span></div><div class="stat glass"><span class="muted">Prossimo evento</span><div class="big">23 Ott</div><span class="badge">18 / 30</span> <small>confermati</small></div></div><div class="columns"><div class="stack"><section class="panel glass">${head('Richiede la tua attenzione','Le priorità di oggi')}${[['⚠','Amaterasu Gold sta per esaurirsi','6 di 40 rimasti. Il nuovo lotto richiede 11 settimane.','Vedi stock','stock'],['♧','Helios Gold: consegna in ritardo di 9 giorni','3 ordini clienti dipendono da questa consegna.','Ordini','orders'],['♔','Sabato è il compleanno di Isabelle Moreau','Possiede Victoria Rose Gold 12/40.','Apri scheda','client'],['♢','Sostituzione lenti in attesa da 4 giorni','Marco Rossi · Ryo Titanium Grey','Assegna','task'],['▥','Campagna autunno: €1.240, nessuna vendita','Controlla i contatti e le opportunità aperte.','Vedi lead','leads'],['♧','3 clienti aspettano Infinity Dark Brown','Riassortimento giovedì: offri prima a loro i nuovi pezzi.','Clienti','clients']].map(([i,t,s,b,v])=>`<div class="alert"><div class="icon">${i}</div><div><strong>${t}</strong><small>${s}</small></div><button class="btn ${v==='stock'?'primary':''}" onclick="${v==='client'?'edit(\'clients\',1)':v==='task'?'newTask()':`go('${v}')`}">${b}</button></div>`).join('')}</section><section class="panel glass">${head('Produttore · Sabae','3 ordini di produzione')}${production()}</section></div><div class="stack"><section class="panel glass">${head('Chi contattare oggi','e perché')}${db.clients.slice(0,4).map(c=>`<div class="contact"><span class="avatar">${esc(c.name.split(' ').map(x=>x[0]).join(''))}</span><div><strong>${esc(c.name)}</strong><small>${esc(c.note)}</small></div><button class="btn" onclick="edit('clients',${c.id})">${esc(c.channel)}</button></div>`).join('')}</section><section class="panel glass">${head('Lead per canale','ultimi 30 giorni')}${[['WhatsApp',18],['Instagram',13],['Website',9],['Boutique',6],['Wholesale',3]].map(([c,n])=>`<div class="barrow"><label>${c}</label><div class="bar"><span style="width:${n/22*100}%"></span></div><b>${n}</b></div>`).join('')}</section><section class="panel glass">${head('Il team questa settimana',`${db.tasks.filter(t=>!t.done).length} aperte`)}${tasks()}</section></div></div>`}function listing(type){let records=db[type].filter(x=>Object.values(x).join(' ').toLowerCase().includes(query.toLowerCase()));return `<section class="panel glass">${head(navs.find(n=>n[0]===type)[2],`${records.length} record`)}<div class="toolbar"><input placeholder="Cerca per nome, stato o canale…" value="${esc(query)}" oninput="query=this.value;updateTable()" id="filter"><button class="btn" onclick="exportCSV('${type}')">↓ Esporta CSV</button><button class="btn primary" onclick="edit('${type}')">+ ${type==='clients'?'Nuovo cliente':type==='leads'?'Nuovo lead':'Nuovo ordine'}</button></div><div style="overflow-x:auto" id="table">${table(type,records)}</div></section>`}function table(type,records){return `<table><thead><tr><th>${type==='orders'?'Ordine':'Nome'}</th><th>Stato</th><th>Canale</th><th>Valore</th></tr></thead><tbody>${records.map(c=>`<tr onclick="edit('${type}',${c.id})"><td><b>${esc(c.name)}</b><small style="display:block;margin-top:6px">${esc(c.email)}</small></td><td><span class="badge ${c.status==='Nuovo'?'gold':''}">${esc(c.status)}</span></td><td>${esc(c.channel)}</td><td>${money(c.value)}</td></tr>`).join('')}</tbody></table>${records.length?'':'<div class="empty">Nessun risultato. Aggiungi il primo record.</div>'}`}function updateTable(){$('#table').innerHTML=table(view,db[view].filter(x=>Object.values(x).join(' ').toLowerCase().includes(query.toLowerCase())))}function render(){$('#nav').innerHTML=navs.map(([v,i,t])=>`<button class="${view===v?'active':''}" aria-current="${view===v?'page':'false'}" onclick="go('${v}')"><i>${i}</i>${t}${v==='leads'?`<span class="count">${db.leads.length}</span>`:''}</button>`).join('');$('#title').textContent=view==='home'?'Buongiorno, Alessandro':navs.find(n=>n[0]===view)[2];$('#content').innerHTML=view==='home'?dashboard():['clients','leads','orders'].includes(view)?listing(view):view==='tasks'?`<section class="panel glass">${head('Team e attività','',`<button class="btn primary" onclick="newTask()">+ Nuova attività</button>`)}${tasks()}</section>`:view==='production'?`<section class="panel glass">${head('Produzione · Sabae','Avanzamento ordini')}${production()}</section>`:view==='stock'?`<section class="panel glass">${head('Edizioni e disponibilità','Collezione 2026')}<table><thead><tr><th>Edizione</th><th>Disponibilità</th><th>Totale</th><th>Prezzo</th></tr></thead><tbody>${[['Amaterasu Gold',6,40,2400],['Helios Gold',12,50,3200],['Infinity Dark Brown',0,40,1800],['Tina Bordeaux',40,40,2200]].map(r=>`<tr><td><b>${r[0]}</b></td><td><span class="badge ${r[1]===0?'red':'gold'}">${r[1]} rimasti</span></td><td>${r[2]} pezzi</td><td>${money(r[3])}</td></tr>`).join('')}</tbody></table></section>`:`<section class="panel glass">${head('Agenda','Ottobre 2026')}<div class="contact"><span class="avatar">23</span><div><strong>Preview · Autumn Editions</strong><small>23 ottobre · 18:30 · Boutique Monaco</small></div><span class="badge">18 confermati</span></div><div class="contact"><span class="avatar">24</span><div><strong>Compleanno · Isabelle Moreau</strong><small>24 ottobre · Promemoria cliente</small></div><button class="btn" onclick="edit('clients',1)">Apri cliente</button></div><button class="btn primary" style="margin-top:20px" onclick="newTask()">+ Aggiungi promemoria</button></section>`}function edit(type,id){let c=db[type].find(x=>x.id===id)||{name:'',email:'',phone:'',channel:'WhatsApp',status:type==='clients'?'Cliente':type==='leads'?'Nuovo':'Confermato',value:0,note:''};let states=type==='clients'?['Cliente','VIP','Lead']:type==='leads'?['Nuovo','Contattato','Proposta','Convertito','Perso']:['Confermato','In produzione','Spedito','Consegnato','Annullato'];$('#modal').innerHTML=`<form id="recordform"><h2>${id?'Modifica':'Nuovo'} ${type==='clients'?'cliente':type==='leads'?'lead':'ordine'}</h2><label>${type==='orders'?'Ordine e cliente':'Nome completo'}<input name="name" required value="${esc(c.name)}"></label><label>${type==='orders'?'Prodotto':'Email'}<input name="email" ${type==='orders'?'':'type="email"'} value="${esc(c.email)}"></label>${type!=='orders'?`<label>Telefono<input name="phone" type="tel" value="${esc(c.phone)}"></label>`:''}<label>Canale<select name="channel">${['WhatsApp','Instagram','Website','Boutique','Email','Telefono','Wholesale'].map(s=>`<option ${c.channel===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Stato<select name="status">${states.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Valore (€)<input name="value" type="number" min="0" step="0.01" required value="${c.value}"></label><label>Note<textarea name="note" rows="3">${esc(c.note)}</textarea></label><footer>${id?'<button type="button" class="btn red" id="delete">Elimina</button>':''}<button type="button" class="btn" onclick="closeModal()">Annulla</button><button class="btn primary">Salva</button></footer></form>`;$('#recordform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.value=Number(data.value);if(id)Object.assign(c,data);else db[type].push({...data,id:Date.now()});save();closeModal();render();toast('Salvato correttamente')};if(id)$('#delete').onclick=()=>{if(confirm('Eliminare questo record?')){db[type]=db[type].filter(x=>x.id!==id);save();closeModal();render();toast('Record eliminato')}};$('#modal').showModal()}function closeModal(){$('#modal').close()}function newTask(){$('#modal').innerHTML=`<form id="taskform"><h2>Nuova attività</h2><label>Attività<input name="name" required autofocus></label><label>Scadenza<input name="date" type="date" required></label><label>Responsabile<input name="owner" required value="Alessandro"></label><footer><button type="button" class="btn" onclick="closeModal()">Annulla</button><button class="btn primary">Aggiungi</button></footer></form>`;$('#taskform').onsubmit=e=>{e.preventDefault();db.tasks.push({...Object.fromEntries(new FormData(e.target)),id:Date.now(),done:false});save();closeModal();render();toast('Attività aggiunta')};$('#modal').showModal()}function exportCSV(type){let keys=['name','email','phone','channel','status','value','note'];let csv='\uFEFF'+[keys,...db[type].map(c=>keys.map(k=>c[k]??''))].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='valtoria-'+type+'.csv';a.click();URL.revokeObjectURL(a.href);toast('Esportazione completata')}$('#globalSearch').oninput=e=>{query=e.target.value;if(!['clients','leads','orders'].includes(view))view='clients';render()};render();
</script></body></html>
